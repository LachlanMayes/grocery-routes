[workspace]
resolver = "3"
members = ["cli", "api", "domain", "geo-au", "routing", "sim", "solver", "console"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
osmpbf = "0.3"
axum = "0.8"
tower-http = { version = "0.6", features = ["limit"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
egui = "0.37"
# eframe: upstream defaults minus the wgpu renderer. glow keeps the dependency
# tree much smaller (better for the security audit) and matches the pre-0.37
# console; see docs/PLAN.md. When bumping eframe, re-check this feature set.
eframe = { version = "0.37", default-features = false, features = [
  "accesskit",
  "clipboard",
  "default_fonts",
  "glow",
  "links",
  "system_fonts",
  "wayland",
  "x11",
] }
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = "0.4"
jiff = { version = "0.2", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
